# Supply-chain checks (ADR-0049; gap analysis 15.1.2, 15.2.1, CC6.8, LLM04; launch plan S0-10):
# dependency audit, secret scan over the history, the image built and scanned, and a CycloneDX
# SBOM of the image kept as a workflow artifact. Runs on pull requests, on main, and weekly, so
# a new advisory against unchanged code is found too. Third-party code runs pinned: actions by
# commit SHA, scanners as images by digest. No job here gets a secret or a write permission.
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays, before Dependabot's weekly run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  # Trivy 0.76.1 (after the March 2026 compromise of 0.69.4-0.69.6, GHSA-69fq-xp46-6x23).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  dependencies:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The versions pip resolves today are the versions the image gets: no lock file (ADR-0009).
      - name: Install the engine with its development dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          cat "$RUNNER_TEMP/installed.txt"

      # pip-audit in its own environment, so its dependencies are not part of the audit.
      - name: pip-audit over the installed versions
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet "pip-audit==$PIP_AUDIT_VERSION"
          "$RUNNER_TEMP/audit/bin/pip-audit" --requirement "$RUNNER_TEMP/installed.txt" \
            --no-deps --disable-pip --strict --aliases on

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # every commit reachable from this one, not only the tip
          persist-credentials: false

      # Default rules plus the synthetic test vectors allowed in .gitleaks.toml (read from /repo).
      - name: gitleaks over the history
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo --log-opts="--full-history HEAD" --redact --no-banner --verbose

  image:
    name: image scan (Trivy) and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: umai-decision-engine:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --pull --tag "$IMAGE" .

      - name: Date for the vulnerability database cache
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-${{ steps.today.outputs.date }}
          restore-keys: trivy-

      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v "$PWD/sbom:/sbom" "$TRIVY_IMAGE" \
            image --format cyclonedx --output /sbom/umai-decision-engine.cdx.json "$IMAGE"

      # Fails on HIGH or CRITICAL vulnerabilities that have a fix, and on secrets in the image.
      # Accepted findings: .trivyignore.yaml, each with a statement and an expiry date.
      - name: Vulnerability and secret scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml --exit-code 1 "$IMAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom-umai-decision-engine
          path: sbom/
          if-no-files-found: warn
          retention-days: 90
