# Single-VM starter stack (ADR-0032). Run through ./umai.sh, which fetches secrets from Key Vault
# into /run/umai (tmpfs) first; never start it with a hand-written .env holding secrets.
#
#   caddy  :80/:443  TLS (Let's Encrypt), optional basic auth on the console, body cap, headers
#   engine :9100     /v1, /healthz, /readyz      (internal network only)
#   policy :9200     policy service, console only (internal network only)
#   console :3100    umai-control-center         (internal network only)
#   gateway :9300    UMAI gateway, OpenAI-compatible (profile "gateway": UMAI_GATEWAY=true)
#   postgres :5432   tenant store with row-level security (ADR-0025); internal only

name: umai

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-engine-env: &engine-env
  UMAI_DE_ENV: production
  UMAI_DE_LOG_LEVEL: INFO
  UMAI_DE_POLICY_DIR: /data/policies
  UMAI_DE_BUNDLE_PUBLIC_KEYS: ${UMAI_BUNDLE_PUBLIC_KEYS:?set in config.env}
  UMAI_DE_REQUIRE_SIGNED_BUNDLES: "true"
  UMAI_DE_KEY_REGISTRY_DIR: /data/policies/.keys  # signed per-tenant key snapshots (ADR-0023)
  UMAI_DE_REGION: ${UMAI_REGION:-sh}
  # Bundles directly under the policy root belong to the default tenant (policy-bundle 0.8):
  # the tenant the console evaluates as. Other tenants need bundles under tenants/<id>/.
  UMAI_DE_DEFAULT_TENANT_ID: ${UMAI_CONSOLE_TENANT_ID:-console}
  # Applications and the AI gateway's providers, one <tenant>.yaml each (gateway-api 0.10): the
  # policy service writes them; the engine and the gateway read them (ADR-0039).
  UMAI_DE_APPLICATIONS_DIR: /data/applications
  # Caddy, and only Caddy, may name the client in X-Forwarded-For (ADR-0046): key network
  # restrictions and the failed-credential throttle see the caller, not the proxy.
  UMAI_DE_TRUSTED_PROXIES: '["172.30.240.2/32"]'

services:
  seed:
    # One-shot: fills an empty policy volume from the image and signs it with the deployment key.
    build: { context: ../.., dockerfile: Dockerfile }
    image: umai-decision-engine:current
    command: ["sh", "/app/deploy/seed-policies.sh"]
    environment:
      UMAI_SIGNING_KEY_ID: ${UMAI_SIGNING_KEY_ID:?set in config.env}
    volumes:
      - policies:/data/policies
      - ./seed-policies.sh:/app/deploy/seed-policies.sh:ro
      - "${UMAI_RUN_DIR:-/run/umai}/signing.key:/run/secrets/signing.key:ro"
    restart: "no"
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: umai
      POSTGRES_USER: umai_owner
      POSTGRES_INITDB_ARGS: "--data-checksums"
    env_file: ["${UMAI_RUN_DIR:-/run/umai}/postgres.env"]  # owner + app passwords
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-umai.sh:ro
      - ../postgres-init.sql:/umai/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umai_owner -d umai"]
      interval: 10s
      timeout: 5s
      start_period: 30s
    shm_size: 128m
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  engine:
    image: umai-decision-engine:current
    environment:
      <<: *engine-env
      # Records (ADR-0041, ADR-0042): decision events and usage to the tenant store; none = off.
      UMAI_DE_RECORDS_SINK: ${UMAI_RECORDS_SINK:-database}
    env_file:
      - "${UMAI_RUN_DIR:-/run/umai}/engine.env"   # operator token, tenant HMAC keys, records DB
      - "${UMAI_RUN_DIR:-/run/umai}/routes.env"   # provider allow-list (applications files)
    volumes:
      - policies:/data/policies:ro
      - "${UMAI_APPLICATIONS:-/opt/umai/applications}:/data/applications:ro"
    depends_on:
      seed: { condition: service_completed_successfully }
      # The policy service runs the migrations (record tables, ADR-0041) before it is healthy.
      policy: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9100/readyz',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 900m
    restart: unless-stopped
    logging: *logging

  policy:
    image: umai-decision-engine:current
    command: ["uvicorn", "umai_decision_engine.control_plane.app:app", "--host", "0.0.0.0", "--port", "9200", "--no-server-header", "--no-proxy-headers"]
    environment:
      <<: *engine-env
      UMAI_DE_SIGNING_KEY_FILE: /run/secrets/signing.key
      UMAI_DE_SIGNING_KEY_ID: ${UMAI_SIGNING_KEY_ID:?set in config.env}
      # The console signs an on-behalf-of assertion for every person (credentials 0.3); the
      # control token alone may only run operator actions. Public key: policy.env (umai.sh).
      UMAI_DE_ACTOR_ASSERTION: ${UMAI_ACTOR_ASSERTION:-required}
      # Every person call must name a live console session (console-sessions 0.1); `optional`
      # only while a console without session records is still running (ADR-0024 §2 amendment).
      UMAI_DE_CONSOLE_SESSIONS: ${UMAI_CONSOLE_SESSIONS:-required}
    env_file:
      - "${UMAI_RUN_DIR:-/run/umai}/policy.env"  # tokens, database URLs, actor public key
      - "${UMAI_RUN_DIR:-/run/umai}/routes.env"  # provider allow-list for validation
    volumes:
      - policies:/data/policies
      - "${UMAI_APPLICATIONS:-/opt/umai/applications}:/data/applications"
      - "${UMAI_RUN_DIR:-/run/umai}/signing.key:/run/secrets/signing.key:ro"
    depends_on:
      seed: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9200/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 900m
    restart: unless-stopped
    logging: *logging

  gateway:
    # Optional (ADR-0034): umai.sh adds the profile when UMAI_GATEWAY=true in config.env.
    profiles: ["gateway"]
    image: umai-decision-engine:current
    command: ["uvicorn", "umai_decision_engine.gateway.app:app", "--host", "0.0.0.0", "--port", "9300", "--no-server-header", "--no-proxy-headers"]
    environment:
      <<: *engine-env
      # Records (ADR-0041 §4): a usage record per call, a decision event per check.
      UMAI_DE_RECORDS_SINK: ${UMAI_RECORDS_SINK:-database}
    env_file:
      - "${UMAI_RUN_DIR:-/run/umai}/engine.env"   # operator token, tenant HMAC keys, records DB
      - "${UMAI_RUN_DIR:-/run/umai}/gateway.env"  # provider keys (gateway only)
      - "${UMAI_RUN_DIR:-/run/umai}/routes.env"   # upstream allow-list (also the policy service)
    volumes:
      - policies:/data/policies:ro
      - "${UMAI_APPLICATIONS:-/opt/umai/applications}:/data/applications:ro"
    depends_on:
      seed: { condition: service_completed_successfully }
      policy: { condition: service_healthy }  # migrations first (record tables)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9300/readyz',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 900m
    restart: unless-stopped
    logging: *logging

  console:
    build: { context: "${UMAI_CONSOLE_SRC:-/opt/umai/src/umai-control-center}" }
    image: umai-control-center:current
    environment:
      UMAI_ENGINE_URL: http://engine:9100
      UMAI_CONTROL_URL: http://policy:9200
      UMAI_ENGINE_TIMEOUT_MS: "10000"
      UMAI_CONSOLE_TENANT_ID: ${UMAI_CONSOLE_TENANT_ID:-console}
      # Sign-in (ADR-0024) and organizations (ADR-0033); secrets in console.env (umai.sh).
      UMAI_CONSOLE_URL: https://${UMAI_HOSTNAME:-localhost}
      UMAI_OIDC_ISSUER: ${UMAI_OIDC_ISSUER:-}
      UMAI_OIDC_CLIENT_ID: ${UMAI_OIDC_CLIENT_ID:-}
      UMAI_CONSOLE_REGION: ${UMAI_REGION:-sh}
      UMAI_PUBLIC_API_URL: https://${UMAI_HOSTNAME:-localhost}
      UMAI_CONSOLE_ACTOR_KEY_FILE: /run/secrets/actor.pem
      UMAI_CONSOLE_ACTOR_KID: ${UMAI_ACTOR_KEY_ID:-console-1}
    env_file: ["${UMAI_RUN_DIR:-/run/umai}/console.env"]
    volumes:
      - "${UMAI_RUN_DIR:-/run/umai}/actor.pem:/run/secrets/actor.pem:ro"
    depends_on:
      engine: { condition: service_healthy }
      policy: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      UMAI_HOSTNAME: ${UMAI_HOSTNAME:?set in config.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${UMAI_RUN_DIR:-/run/umai}/console-gate.caddy:/run/umai/console-gate.caddy:ro"
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.240.2  # the trusted proxy (UMAI_DE_TRUSTED_PROXIES above)
    depends_on: [engine, console]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

networks:
  default:
    # A fixed subnet, so Caddy has a fixed address the engine and the gateway trust (ADR-0046).
    # Other containers get dynamic addresses from the upper half only. Compose recreates an
    # existing umai_default network with this configuration on the next `umai.sh up`.
    ipam:
      config:
        - subnet: 172.30.240.0/24
          ip_range: 172.30.240.128/25
          gateway: 172.30.240.1

volumes:
  policies:
  postgres:
  caddy_data:
  caddy_config:
