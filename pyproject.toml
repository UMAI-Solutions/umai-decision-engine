[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umai-decision-engine"
version = "0.1.0"
description = "Layered detection and decision engine (L0 entity detection, L1 decision, L2 review)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer==2.2.364",
    "regex>=2024.11.6",
    "phonenumbers>=9.0.28,<10",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<0.36",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1.0",
    "pyyaml>=6,<7",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umai_decision_engine = ["l0/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real external providers; needs keys in .env",
    "slow: slow tests (large inputs, NER)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish and typographic characters are intentional

[tool.ruff.lint.isort]
known-first-party = ["umai_decision_engine", "evals", "tests"]
