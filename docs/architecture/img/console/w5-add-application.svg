<text x="392" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">Change the base URL of your OpenAI SDK. No code changes.</text>
<rect x="354" y="452" width="492" height="64" rx="8" fill="#fff" stroke="#d9dbe0" stroke-width="1"/>
<circle cx="376" cy="476" r="7" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
