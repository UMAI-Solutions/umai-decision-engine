# Guardrail template (ADR-0056 §3): the L0 data-protection policies of the starter
# guardrail, without decision policies (A26). Synthetic cases only.
contract_version: '0.9'
id: tpl-kvkk-data-protection
version: 1
name: KVKK veri koruma
description: Kimlik ve finansal verileri, gizli anahtarları engeller; iletişim bilgilerini maskeler.
mode: ENFORCE
phases:
- PRE_LLM
- POST_LLM
- TOOL_INPUT
- TOOL_OUTPUT
on_evaluation_failure: fail_closed
l0:
  target: LAST_MESSAGE
  max_chars: 32000
  policies:
  - id: identity-data
    version: 2
    name: Kimlik verileri
    description: Türkiye, ABD ve Avrupa kimlik ve vergi numaraları
    entities:
    - TR_TCKN
    - TR_VKN
    - US_SSN
    - UK_NINO
    - DE_TAX_ID
    - FR_NIR
    - ES_NIF
    - ES_NIE
    - IT_FISCAL_CODE
    - NL_BSN
    - PL_PESEL
    action: BLOCK
    severity: HIGH
    roles:
    - user
    - assistant
    - tool
    - tool_call
    - memory
    sensitivity: L3
  - id: payment-data
    version: 1
    name: Finansal veriler
    entities:
    - CREDIT_CARD
    - TR_IBAN
    - IBAN_CODE
    action: BLOCK
    severity: HIGH
    sensitivity: L3
  - id: contact-data
    version: 1
    name: İletişim bilgileri
    description: Kişi adları, adresler, telefonlar, e-postalar, IP ve plakalar maskelenir
    entities:
    - PERSON
    - ADDRESS
    - TR_PHONE
    - PHONE_NUMBER
    - EMAIL_ADDRESS
    - IP_ADDRESS
    - TR_PLATE
    action: ALLOW_WITH_MODIFICATIONS
    severity: MEDIUM
    roles:
    - user
    - assistant
    sensitivity: L3
  - id: secrets
    version: 1
    name: Gizli anahtarlar
    entities:
    - API_KEY
    - PRIVATE_KEY
    - JWT
    - CONNECTION_STRING
    - PASSWORD
    action: BLOCK
    severity: CRITICAL
    sensitivity: L4
  - id: unknown-links
    version: 1
    name: Bilinmeyen bağlantılar
    entities:
    - UNKNOWN_LINK
    action: BLOCK
    severity: MEDIUM
    roles:
    - assistant
    - tool
    sensitivity: L3
  exceptions:
  - id: ex-kyc-internal
    description: KYC may send national IDs to internal applications
    when:
      all:
      - field: subject.department
        operator: EQUALS
        value: KYC
      - field: destination.class
        operator: EQUALS
        value: internal_app
    entities:
    - TR_TCKN
    action: ALLOW
l1a:
  rules: []
l2:
  enabled: false
